<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Proyecto Galeria de imágenes</title>
</head>

<body>

    <header>
        <h2>Proyecto de galería de imágenes en grupo</h2>
    </header>

    <header class="nav-bar">
        <a href="#" class="logo">
            <img src="imagenes/pexels-logo.jpg" alt="Logo Pexels">
        </a>

        <form class="formContainer" id="formBuscador">
            <input class="inputContainer" id="inputBuscador" type="search" placeholder="Buscar fotos">
            <button class="btnnBuscador" type="submit">Buscar</button>
        </form>
    </header>

    <section class="flexContainer" id="seccionPrincipal">
        <article>
            <figure id="figura1"></figure>
        </article>
        <article>
            <figure id="figura2"></figure>
        </article>
        <article>
            <figure id="figura3"></figure>
        </article>
    </section>

    <form id="formPaginacion" class="paginacion oculto">
        <button type="button" id="pagBtnAnterior">ANTERIOR</button>

        <input type="number" id="inputPaginacion" name="nPagina" readonly>

        <button type="button" id="pagBtnSiguiente">SIGUIENTE</button>
    </form>

    <section id="seccionGaleria" class="seccionGaleria flexContainer"></section>

    <section id="seccionFavoritos" class="flexContainer">
        <h2>Mis Favoritos</h2>
        <div id="contenedorFavoritos" class="flexContainer"></div>
    </section>

    <script src="js/main.js"></script>

</body>

</html>
