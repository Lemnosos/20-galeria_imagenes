<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Proyecto Galeria de imágenes</title>
</head>

<body>

    <header class="nav-bar">
        <a href="#" class="logo">
            <img src="imagenes/pexels-logo.jpg">
        </a>
        <form class="formContainer" id="formBuscador">
            <input class="inputContainer" id="inputBuscador" type="search" placeholder="Buscar fotos">
            <button class="btnnBuscador" type="submit" id="btnBuscador">Buscar</button>
        </form>
    </header>

    <section class="flexContainer" id="seccionPrincipal">
        <article>
            <figure id="figura1">
                <div class="imageContainer">
                    <img src="ruta/de/tu/imagen.jpg" alt="Imagen aleatoria de la categoria ciencia ficcion">
                </div>
                <figcaption>Figura 1: Esta es la descripción de la imagen aleatoria de la categoria ciencia ficcion.
                </figcaption>
            </figure>
        </article>
        <article>
            <figure id="figura2">
                <div class="imageContainer">
                    <img src="ruta/de/tu/imagen.jpg" alt="Imagen aleatoria de la categoria espacio">
                </div>
                <figcaption>Figura 2: Esta es la descripción de la imagen aleatoria de la categoria espacio.
                </figcaption>
            </figure>
        </article>
        <article>
            <figure id="figura3">
                <div class="imageContainer">
                    <img src="ruta/de/tu/imagen.jpg" alt="Imagen aleatoria de la categoria ejército">
                </div>
                <figcaption>Figura 3: Esta es la descripción de la imagen aleatoria de la categoria ejército.
                </figcaption>
            </figure>
        </article>
    </section>

    <form id="formPaginacion" class="paginacion oculto">
        <button name="previous" id="pagBtnAnterior">ANTERIOR</button>
        <input type="number" name="nPagina" placeholder="Introducir Pagina">
        <button name="next" id="pagBtnSiguiente">SIGUIENTE</button>
    </form>

    <section id="seccionGaleria"></section>

    <script src="js/main.js"></script>

</body>

</html>
